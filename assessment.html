#nav{display:flex;flex-wrap:wrap;gap:5px;max-width:720px;margin:0 auto 16px;padding:0 8px}

@media(max-width:640px){.compare,.compare.three{grid-template-columns:1fr}.learning-nav a{flex-basis:calc(50% - 7px)}}

<script>
const Q=[
  {
    "src": "Practicality",
    "cat": "Application",
    "text": "A test may match the course objectives but still be impractical if its scoring cannot be completed with the available time and staff.",
    "ans": true,
    "correct": "맞습니다. Practicality는 준비·실시·채점에 필요한 시간과 자원에 관한 판단입니다.",
    "why": "Practicality는 준비·실시·채점에 필요한 시간과 자원에 관한 판단입니다. 목표와의 일치가 운영 가능성까지 보장하지는 않습니다.",
    "source": "근거를 바탕으로 재서술: Build-up II, Assessment, Practicality section (직접 인용 아님)"
  },
  {
    "src": "Inter-rater reliability",
    "cat": "Application",
    "text": "Two teachers give substantially different scores to the same essays. This is primarily a problem of intra-rater reliability.",
    "ans": false,
    "correct": "틀립니다. 같은 답안에 두 채점자가 다른 점수를 주므로 inter-rater reliability 문제입니다.",
    "why": "같은 답안에 두 채점자가 다른 점수를 주므로 inter-rater reliability 문제입니다. Intra-rater는 한 채점자가 기준을 일관되게 적용하는지입니다. 2014 A-7의 평가자 간 점수 불일치 원리를 바꾼 학습용 예시이며 기출 원문이 아닙니다.",
    "source": "근거를 바탕으로 재서술: Build-up II, Assessment, Rater Reliability; 2014 A-7 원문 대조 (직접 인용 아님)",
    "compare": [
      {
        "title": "Inter-rater",
        "desc": "서로 다른 채점자 사이 consistency"
      },
      {
        "title": "Intra-rater",
        "desc": "한 채점자의 기준 적용 consistency"
      }
    ]
  },
  {
    "src": "Intra-rater reliability",
    "cat": "Application",
    "text": "A teacher becomes tired and applies the rubric more leniently to the final essays than to the first ones. This threatens intra-rater reliability.",
    "ans": true,
    "correct": "맞습니다. 채점자가 한 명이어도 피로 때문에 기준이 달라지면 consistency가 흔들립니다.",
    "why": "채점자가 한 명이어도 피로 때문에 기준이 달라지면 consistency가 흔들립니다. 공통 sample 재확인과 채점 중 기준 점검이 도움이 됩니다.",
    "source": "근거를 바탕으로 재서술: Build-up II, Assessment, Rater Reliability (직접 인용 아님)"
  },
  {
    "src": "Validity and reliability",
    "cat": "Application",
    "text": "If raters consistently score only grammatical accuracy, those scores must be valid measures of overall communicative speaking ability.",
    "ans": false,
    "correct": "틀립니다. 일관성은 reliability의 근거일 수 있지만 충분한 construct coverage를 보장하지 않습니다.",
    "why": "일관성은 reliability의 근거일 수 있지만 충분한 construct coverage를 보장하지 않습니다. 목표가 전체 communicative speaking ability라면 grammar 외의 필요한 측면도 평가해야 합니다.",
    "source": "근거를 바탕으로 재서술: Handbook, Language Assessment, pp.282–285 (직접 인용 아님)",
    "compare": [
      {
        "title": "Reliability",
        "desc": "측정 결과의 consistency"
      },
      {
        "title": "Validity",
        "desc": "의도한 목적에 맞는 점수 해석의 근거"
      }
    ]
  },
  {
    "src": "Content validity",
    "cat": "Application",
    "text": "A reading achievement test covers reference questions but omits the inference and main-idea skills taught as major course objectives. Its domain coverage is inadequate.",
    "ans": true,
    "correct": "맞습니다. 개별 reference 문항이 적절해도 주요 목표가 빠지면 내용 표집이 불충분합니다.",
    "why": "개별 reference 문항이 적절해도 주요 목표가 빠지면 내용 표집이 불충분합니다. Item representativeness와 domain coverage를 함께 확인해야 합니다.",
    "source": "근거를 바탕으로 재서술: Handbook, Language Assessment, pp.282–283 (직접 인용 아님)"
  },
  {
    "src": "Construct validity",
    "cat": "Application",
    "text": "In a listening-only assessment, heavily penalizing written spelling errors is automatically justified because every response must be scored.",
    "ans": false,
    "correct": "틀립니다. 의도한 construct가 listening comprehension이라면 spelling 능력이 점수를 크게 좌우하는 것은 construct-irrelevant variance가 될 수 있습니다.",
    "why": "의도한 construct가 listening comprehension이라면 spelling 능력이 점수를 크게 좌우하는 것은 construct-irrelevant variance가 될 수 있습니다. Listening과 writing의 통합 능력을 재려는 평가인지 먼저 확인해야 합니다.",
    "source": "근거를 바탕으로 재서술: Handbook, Language Assessment, p.283 (직접 인용 아님)"
  },
  {
    "src": "Criterion-related validity",
    "cat": "Application",
    "text": "Asking colleagues to compare a new test with its specifications directly establishes concurrent validity.",
    "ans": false,
    "correct": "틀립니다. 문항과 specification의 대조는 내용·설계 검토입니다.",
    "why": "문항과 specification의 대조는 내용·설계 검토입니다. Concurrent evidence에는 비슷한 시점의 적절한 외적 criterion과 점수의 관계가 필요합니다.",
    "source": "근거를 바탕으로 재서술: Build-up II, Assessment, Criterion-related Validity; Handbook p.282 (직접 인용 아님)",
    "compare": [
      {
        "title": "Concurrent",
        "desc": "비슷한 시점의 관련 criterion"
      },
      {
        "title": "Predictive",
        "desc": "이후의 관련 수행 criterion"
      }
    ]
  },
  {
    "src": "Criterion-related validity",
    "cat": "Application",
    "text": "Evidence that an entrance language test predicts later performance in the target academic program is relevant to predictive validity.",
    "ans": true,
    "correct": "맞습니다. 현재 점수와 이후의 관련 수행을 연결하므로 predictive evidence입니다.",
    "why": "현재 점수와 이후의 관련 수행을 연결하므로 predictive evidence입니다. 단순히 시간 간격이 있다는 사실이 아니라 의도한 미래 criterion과의 관계가 중요합니다.",
    "source": "근거를 바탕으로 재서술: Build-up II, Assessment, Criterion-related Validity; Handbook p.282 (직접 인용 아님)",
    "compare": [
      {
        "title": "Concurrent",
        "desc": "비슷한 시점의 관련 criterion"
      },
      {
        "title": "Predictive",
        "desc": "이후의 관련 수행 criterion"
      }
    ]
  },
  {
    "src": "Authenticity",
    "cat": "Application",
    "text": "Using a real newspaper article guarantees that every test task based on it has high authenticity for the intended target language use.",
    "ans": false,

    "why": "실제 자료를 사용해도 과제의 response와 목적이 target language use에 대응하지 않을 수 있습니다. 자료의 출처뿐 아니라 학생이 무엇을 하도록 요구받는지 확인합니다.",

    "why": "Criterion-referenced interpretation은 정해진 수행 기준과 비교하므로 모두 기준을 충족할 수 있습니다. 다른 응시자와의 상대적 위치를 기준으로 삼는 것은 norm-referenced interpretation입니다.",
    "source": "근거를 바탕으로 재서술: Handbook, Language Assessment, pp.293–294 (직접 인용 아님)"
  },
  {

    "source": "근거를 바탕으로 재서술: Build-up II, Assessment, Purpose-based Tests (직접 인용 아님)",

      {
        "title": "Placement",

      {

    "cat": "Application",
    "text": "A task requiring learners to listen to a report and write a summary draws on more than one language skill and can be classified as integrative testing.",

    "correct": "맞습니다. Listening과 writing을 하나의 과제에서 함께 요구합니다.",
    "why": "Listening과 writing을 하나의 과제에서 함께 요구합니다. 2014 A-7의 skill 결합 원리를 변형한 예시이며 기출 원문이 아닙니다. Integrative라는 사실만으로 모든 scoring 문제가 해결되지는 않습니다.",
    "source": "근거를 바탕으로 재서술: Handbook pp.292–293; 2014 A-7 원문 대조 (직접 인용 아님)"
  },
  {
    "src": "Portfolio",
    "cat": "Application",
    "text": "Collecting every assignment in a folder automatically makes the assessment formative, even if no one reviews or uses the work to guide further learning.",
    "ans": false,
    "correct": "틀립니다. Portfolio의 formative 기능에는 목적 있는 선정, reflection, feedback과 후속 학습의 연결이 필요합니다.",
    "why": "Portfolio의 formative 기능에는 목적 있는 선정, reflection, feedback과 후속 학습의 연결이 필요합니다. 보관 자체는 학습 조정을 보장하지 않으며 portfolio를 최종 성취 판단에 사용할 수도 있습니다.",

  },
  {

    "cat": "Application",
    "text": "Once separate scores for content, organization and language are added to produce a total, the scoring procedure becomes holistic.",

    "correct": "틀립니다. 하위 기준별로 점수를 부여했다면 합산해도 analytic scoring입니다.",
    "why": "하위 기준별로 점수를 부여했다면 합산해도 analytic scoring입니다. Holistic scoring은 수행 전체에 한 평정을 내리는 방식이며, 기준이 없다는 뜻은 아닙니다.",
    "source": "근거를 바탕으로 재서술: Handbook, Language Assessment, p.316; Build-up II, Analytic Scoring (직접 인용 아님)",
    "compare": [
      {
        "title": "Analytic",

      {

      }

    "cat": "Application",
    "text": "Keeping tense constant across options while varying word order can help an item focus on embedded-question word order rather than mixed content.",
    "ans": true,
    "correct": "맞습니다. 목표와 무관한 tense 변이를 통제하면 word order라는 한 문제에 집중할 수 있습니다.",
    "why": "목표와 무관한 tense 변이를 통제하면 word order라는 한 문제에 집중할 수 있습니다. 2023 B-11의 guideline ③을 재구성한 설명입니다. Stem을 짧게 하는 guideline ②와 구분해야 합니다.",
    "source": "근거를 바탕으로 재서술: 2023 B-11 원문 대조; Handbook pp.298–305 (직접 인용 아님)"
  },

    "text": "If 18 of 24 learners answer an item correctly, its item facility is .75, meaning it was harder for this group than an item with facility .25.",
    "ans": false,
    "correct": "틀립니다. 계산 .75는 맞지만 해석이 반대입니다.",
    "why": "계산 .75는 맞지만 해석이 반대입니다. Facility는 정답 비율이므로 같은 집단에서 값이 클수록 쉬웠습니다. 문항의 유지 여부는 검사 목적도 고려해야 합니다.",

    "source": "근거를 바탕으로 재서술: Handbook, Language Assessment, pp.307–309 (직접 인용 아님)",

      {

const TOTAL=20;
const SAVE_KEY='ox_assessment_v2_content_20261017';
let cur=0,answers=new Array(TOTAL).fill(null);
let mode='normal',order=[...Array(TOTAL).keys()];
function initOrder(m){if(m==='random'){const a=[...Array(TOTAL).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}order=a;}else order=[...Array(TOTAL).keys()];}
function updateModeUI(){document.getElementById('btn-normal').classList.toggle('active',mode==='normal');document.getElementById('btn-random').classList.toggle('active',mode==='random');}
function setMode(m){if(mode===m)return;mode=m;initOrder(m);cur=0;answers=new Array(TOTAL).fill(null);localStorage.removeItem(SAVE_KEY);document.getElementById('rb').style.display='none';document.getElementById('sc').classList.remove('show');updateModeUI();renderNav();render();}
function getScore(){return answers.filter(a=>a&&a.correct).length;}
function saveProgress(){localStorage.setItem(SAVE_KEY,JSON.stringify({cur,answers,mode,order}));}
function clearProgress(){localStorage.removeItem(SAVE_KEY);}
function freshStart(){clearProgress();cur=0;answers=new Array(TOTAL).fill(null);mode='normal';order=[...Array(TOTAL).keys()];document.getElementById('rb').style.display='none';updateModeUI();renderNav();render();}
function restart(){cur=0;answers=new Array(TOTAL).fill(null);mode='normal';order=[...Array(TOTAL).keys()];clearProgress();document.getElementById('sc').classList.remove('show');document.getElementById('rb').style.display='none';document.getElementById('qa').style.display='block';updateModeUI();renderNav();render();}

function renderExp(q,isCorrect){
  const three=q.compare&&q.compare.length===3;
  const cmp=q.compare?`<div class="sec-label">📊 비교 정리</div><div class="compare${three?' three':''}">${q.compare.map(c=>`<div class="compare-item"><div class="ci-title">${c.title}</div><p>${c.desc}</p></div>`).join('')}</div>`:'';
  return `<div class="exp show"><div class="exp-header"><span>${isCorrect?'✅ 정답':'❌ 오답'} · 해설</span></div><div class="exp-answer"><div class="ans-label">핵심 정정</div><div class="ans-text">${q.correct}</div></div><div class="exp-body"><div class="sec-label">📖 상세 설명</div><p>${q.why}</p><div class="sec-label">📌 Source</div><div class="def-box"><p>${q.source}</p></div>${cmp}</div></div>`;
}

function renderNav(){
  document.getElementById('nav').innerHTML=answers.map((a,i)=>{
    let cls='nd';
    if(i===cur)cls+=' cur';
    else if(a!==null)cls+=a.correct?' ok':' ng';
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
}

function render(){
  if(cur>=TOTAL){
    document.getElementById('qa').style.display='none';
    document.getElementById('sc').classList.add('show');
    const s=getScore();
    document.getElementById('fs').textContent=s;
    const p=s/TOTAL;
    document.getElementById('rm').textContent=p===1?'🎉 Perfect!':p>=.8?'👏 Great!':p>=.6?'😊 Good!':'💪 Keep going!';
    document.getElementById('rs').textContent=`${TOTAL}문제 중 ${s}문제 정답 (${Math.round(p*100)}%)`;
    setTimeout(function(){window.showScorePopup&&window.showScorePopup(s,TOTAL);},400);
    renderNav();return;
  }
  document.getElementById('sc').classList.remove('show');
  document.getElementById('qa').style.display='block';
  renderNav();
  const q=Q[order[cur]];
  document.getElementById('bf').style.width=((cur+1)/TOTAL*100).toFixed(1)+'%';
  document.getElementById('pt').textContent=`${cur+1} / ${TOTAL}`;
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  const a=answers[cur];
  if(a!==null){
    let oBtnCls='',xBtnCls='';
    if(a.picked===true){oBtnCls=a.correct?'co':'wp';if(!a.correct)xBtnCls='cx';}
    else{xBtnCls=a.correct?'cx':'wp';if(!a.correct)oBtnCls='co';}
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn ${oBtnCls}" disabled>⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn ${xBtnCls}" disabled>❌<span class="lb">WRONG</span></button></div><div class="badge ${a.correct?'ok':'ng'}">${a.correct?'✅ 정답!':'❌ 오답! 정답은 '+(q.ans?'O':'X')}</div><div>${renderExp(q,a.correct)}</div><button class="next-btn show" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }else{
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn" onclick="pick(true)" id="ob">⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn" onclick="pick(false)" id="xb">❌<span class="lb">WRONG</span></button></div><div id="bd" class="badge"></div><div id="ep"></div><button class="next-btn" id="nb" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }
}

function pick(val){
  const q=Q[order[cur]];
  document.getElementById('ob').disabled=true;
  document.getElementById('xb').disabled=true;
  const ok=val===q.ans;
  answers[cur]={picked:val,correct:ok};
  if(ok){if(typeof playOk==='function')playOk();}else{if(typeof playNg==='function')playNg();}
  const bd=document.getElementById('bd');
  bd.textContent=ok?'✅ 정답!':`❌ 오답! 정답은 ${q.ans?'O':'X'}`;
  bd.className='badge '+(ok?'ok':'ng');
  document.getElementById(val?'ob':'xb').classList.add(ok?(val?'co':'cx'):'wp');
  if(!ok)document.getElementById(q.ans?'ob':'xb').classList.add(q.ans?'co':'cx');
  document.getElementById('ep').innerHTML=renderExp(q,ok);
  document.getElementById('nb').classList.add('show');
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  renderNav();saveProgress();
}

function next(){cur++;saveProgress();render();}
function jumpTo(i){cur=i;render();document.getElementById('qa').scrollIntoView({behavior:'smooth',block:'start'});}

(function(){
  const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  if(saved&&saved.answers&&saved.cur>=0&&saved.cur<TOTAL){
    cur=saved.cur;answers=saved.answers;
    if(saved.mode){mode=saved.mode;order=saved.order||[...Array(TOTAL).keys()];}
    const done=answers.filter(a=>a!==null).length;
    if(done>0){document.getElementById('rb-msg').textContent=`이어서 풀기 중 · ${done}/${TOTAL} 문제 완료 (정답 ${getScore()}개)`;document.getElementById('rb').style.display='block';}
  }
  updateModeUI();renderNav();render();
})();
</script>

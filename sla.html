<script>
const SAVE_KEY='ox_sla_v2_content_20261017';
const TOTAL=20;
let cur=0;
let answers=new Array(TOTAL).fill(null);
let mode='normal',order=[...Array(TOTAL).keys()];
function initOrder(m){if(m==='random'){const a=[...Array(TOTAL).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}order=a;}else order=[...Array(TOTAL).keys()];}
function updateModeUI(){document.getElementById('btn-normal').classList.toggle('active',mode==='normal');document.getElementById('btn-random').classList.toggle('active',mode==='random');}
function setMode(m){if(mode===m)return;mode=m;initOrder(m);cur=0;answers=new Array(TOTAL).fill(null);localStorage.removeItem(SAVE_KEY);document.getElementById('rb').style.display='none';document.getElementById('sc').classList.remove('show');updateModeUI();renderNav();render();}
function getScore(){return answers.filter(a=>a&&a.correct).length;}
const Q=[
  {
    "src": "Behaviorism",
    "cat": "Structuralism / ALM",
    "text": "<span class='kw1'>Rote learning</span> involves storing new information by connecting it to existing cognitive structures, which promotes strong retention and meaningful understanding.",
    "ans": false,
    "correct": "<span class='kw1'>Rote learning</span> involves <span class='kw2'>isolated</span> storage with <span class='kw2'>no association</span> to existing cognitive structure. That is <span class='kw4'>meaningful learning (Subsumption)</span>.",
    "why": "Rote learning은 기존 인지 구조와의 연결 없이 개별 항목을 고립적으로 저장하는 방식입니다. 반대로 <span class='kw4'>Meaningful learning (Subsumption)</span>은 새 정보를 기존 인지 구조에 연결·통합하여 오래 기억하도록 돕습니다.",
    "source": "출처 요약: Brown (2014), Principles of Language Learning and Teaching, 6th ed., pp.83–86. 직접 인용이 아닙니다.",
    "compare": [
      {
        "title": "<span class='kw1'>Rote learning</span>",
        "desc": "<span class='kw2'>isolated</span> · no cognitive connection · weak retention"
      },
      {
        "title": "<span class='kw4'>Meaningful learning</span>",
        "desc": "<span class='kw2'>anchoring</span> to existing structure · strong retention"
      }
    ]
  },
  {
    "src": "Behaviorism",
    "cat": "Pattern Drills",
    "text": "In the <span class='kw1'>Audiolingual Method</span>, <span class='kw1'>pattern drills</span> are communicative activities where students use language meaningfully to express their own ideas and opinions.",
    "ans": false,
    "correct": "ALM의 pattern drills는 모델의 반복·대치 등 통제된 형태 연습으로 habit formation을 목표로 합니다. 학습자 자신의 정보를 교환하는 communicative activity와는 목적이 다릅니다.",
    "why": "내용을 모른 채 소리를 반복하는 기계적 연습이 될 수 있으나, 모든 drill에서 의미 이해가 완전히 배제된다고 정의하지 않습니다. ALM에서는 명시적 문법 설명보다 패턴의 반복과 inductive analogy를 강조합니다.",
    "source": "출처 요약: Brown (2007), Teaching by Principles, 3rd ed., pp.22–24. 직접 인용이 아닙니다.",
    "compare": [
      {
        "title": "Pattern drill",
        "desc": "정해진 모델·형태 연습·habit formation"
      },
      {
        "title": "Communicative activity",
        "desc": "학습자 자신의 정보·의미 전달·상대방 반응"
      }
    ]
  },
  {
    "src": "Krashen",
    "cat": "Acquisition vs Learning",
    "text": "According to Krashen's <span class='kw4'>Non-interface position</span>, <span class='kw2'>acquired knowledge</span> and <span class='kw2'>learnt knowledge</span> can be integrated through sufficient practice, eventually allowing learned rules to become acquired.",
    "ans": false,
    "correct": "Krashen의 non-interface position에서는 learnt knowledge가 acquired knowledge로 직접 전환되지 않습니다.",
    "why": "두 체계의 전환을 부정하는 것과 두 체계가 같은 수행에 기여하지 못한다는 것은 다릅니다. Acquired system이 발화를 시작하고 learnt knowledge는 조건이 맞으면 Monitor로 편집할 수 있습니다.",
    "source": "출처 요약: Krashen (1982), Principles and Practice in Second Language Acquisition, pp.15–16, 83–90. 직접 인용이 아닙니다.",
    "compare": [
      {
        "title": "<span class='kw4'>Non-interface (Krashen)</span>",
        "desc": "Acquisition ≠ Learning · <span class='kw2'>no transfer</span>"
      },
      {
        "title": "<span class='kw3'>Interface position (Bialystok)</span>",
        "desc": "Explicit → Implicit <span class='kw2'>through practice</span>"
      }
    ]
  },
  {
    "src": "Krashen",
    "cat": "Monitor Hypothesis",
    "text": "According to Krashen's <span class='kw4'>Monitor Hypothesis</span>, the monitor functions effectively in all communicative situations, automatically editing output during spontaneous conversation.",
    "ans": false,
    "correct": "Monitor의 사용에는 충분한 시간, 규칙에 대한 지식, 형식·정확성에 대한 주의가 필요합니다. 자발적 대화에서 항상 자동으로 작동하는 것은 아닙니다.",
    "why": "자발적 대화에서는 Monitor의 사용 조건을 충족하기 어렵지만, 대화 중 사용이 전혀 불가능하다고 단정할 수도 없습니다. Krashen은 규칙과 상황에 따라 대화에서도 제한적으로 Monitor를 사용할 수 있음을 설명합니다.",
    "source": "출처 요약: Krashen (1982), Principles and Practice in Second Language Acquisition, pp.16, 89–90. Monitor의 조건과 대화 중 제한적 사용 가능성을 구분한다. 직접 인용이 아님.",
    "compare": [
      {
        "title": "사용 조건",
        "desc": "충분한 시간 · 규칙 지식 · 형식에 대한 주의"
      },
      {
        "title": "자발적 대화",
        "desc": "조건 충족이 어려울 수 있으나 사용이 항상 불가능한 것은 아님"
      }
    ]
  },
  {
    "src": "Krashen",
    "cat": "Affective Filter",
    "text": "According to Krashen's <span class='kw4'>Affective Filter Hypothesis</span>, learners with high motivation, low anxiety, and high self-esteem have a <span class='kw2'>higher</span> affective filter, which facilitates language acquisition.",
    "ans": false,
    "correct": "High motivation + low anxiety + high self-esteem = <span class='kw2'>LOWER</span> affective filter → <span class='kw2'>better acquisition</span>. A high filter <span class='kw2'>blocks</span> input.",
    "why": "Affective filter는 comprehensible input이 intake로 전환되는 것을 막는 mental block입니다. Filter가 낮을수록 input이 더 잘 흡수됩니다.",
    "source": "출처 요약: Brown (2014), Principles of Language Learning and Teaching, 6th ed., p.289. 직접 인용이 아닙니다.",
    "compare": [
      {
        "title": "<span class='kw2'>Low filter</span>",
        "desc": "low anxiety · high motivation → acquisition↑"
      },
      {
        "title": "<span class='kw2'>High filter</span>",
        "desc": "high anxiety · low confidence → input blocked"
      }
    ]
  },
  {
    "src": "Swain's Output Hypothesis",

    if(i===cur)cls+=' cur';
    else if(a!==null)cls+=a.correct?' ok':' ng';
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
}
function render(){
  if(cur>=TOTAL){
    document.getElementById('qa').style.display='none';
    document.getElementById('sc').classList.add('show');
    const s=getScore();
    document.getElementById('fs').textContent=s;
    const p=s/TOTAL;
    document.getElementById('rm').textContent=p===1?'🎉 Perfect!':p>=.8?'👏 Great!':p>=.6?'😊 Good!':'💪 Keep going!';
    document.getElementById('rs').textContent=`${TOTAL}문제 중 ${s}문제 정답 (${Math.round(p*100)}%)`;
    setTimeout(function(){window.showScorePopup&&window.showScorePopup(s,TOTAL);},400);
    renderNav();return;
  }
  document.getElementById('sc').classList.remove('show');
  document.getElementById('qa').style.display='block';
  renderNav();
  const q=Q[order[cur]];
  document.getElementById('bf').style.width=((cur+1)/TOTAL*100).toFixed(1)+'%';
  document.getElementById('pt').textContent=`${cur+1} / ${TOTAL}`;
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  const a=answers[cur];
  if(a!==null){
    let oBtnCls='',xBtnCls='';
    if(a.picked===true){oBtnCls=a.correct?'co':'wp';if(!a.correct)xBtnCls='cx';}
    else{xBtnCls=a.correct?'cx':'wp';if(!a.correct)oBtnCls='co';}
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn ${oBtnCls}" disabled>⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn ${xBtnCls}" disabled>❌<span class="lb">WRONG</span></button></div><div class="badge ${a.correct?'ok':'ng'}">${a.correct?'✅ 정답!':'❌ 오답! 정답은 '+(q.ans?'O':'X')}</div><div>${renderExp(q,a.correct)}</div><button class="next-btn show" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }else{
    document.getElementById('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn" onclick="pick(true)" id="ob">⭕<span class="lb">CORRECT</span></button><button class="ox-btn x-btn" onclick="pick(false)" id="xb">❌<span class="lb">WRONG</span></button></div><div id="bd" class="badge"></div><div id="ep"></div><button class="next-btn" id="nb" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button></div>`;
  }
}
function pick(val){
  const q=Q[order[cur]];
  document.getElementById('ob').disabled=true;
  document.getElementById('xb').disabled=true;
  const ok=val===q.ans;
  answers[cur]={picked:val,correct:ok};
  if(ok){if(typeof playOk==='function')playOk();}else{if(typeof playNg==='function')playNg();}
  const bd=document.getElementById('bd');
  bd.textContent=ok?'✅ 정답!':`❌ 오답! 정답은 ${q.ans?'O':'X'}`;
  bd.className='badge '+(ok?'ok':'ng');
  document.getElementById(val?'ob':'xb').classList.add(ok?(val?'co':'cx'):'wp');
  if(!ok)document.getElementById(q.ans?'ob':'xb').classList.add(q.ans?'co':'cx');
  document.getElementById('ep').innerHTML=renderExp(q,ok);
  document.getElementById('nb').classList.add('show');
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  renderNav();saveProgress();
}
function next(){cur++;saveProgress();render();}
function jumpTo(i){cur=i;render();document.getElementById('qa').scrollIntoView({behavior:'smooth',block:'start'});}
function saveProgress(){localStorage.setItem(SAVE_KEY,JSON.stringify({cur,answers,mode,order}));}
function freshStart(){localStorage.removeItem(SAVE_KEY);cur=0;answers=new Array(TOTAL).fill(null);mode='normal';order=[...Array(TOTAL).keys()];document.getElementById('rb').style.display='none';document.getElementById('sc').classList.remove('show');document.getElementById('qa').style.display='block';updateModeUI();renderNav();render();}
(function(){
  const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  if(saved&&saved.answers&&saved.cur>=0&&saved.cur<TOTAL){
    cur=saved.cur;answers=saved.answers;
    if(saved.mode){mode=saved.mode;order=saved.order||[...Array(TOTAL).keys()];}
    const done=answers.filter(a=>a!==null).length;
    if(done>0){document.getElementById('rb-msg').textContent=`이어서 풀기 중 · ${done}/${TOTAL} 문제 완료 (정답 ${getScore()}개)`;document.getElementById('rb').style.display='block';}
  }
  updateModeUI();renderNav();render();
})();
</script>

<script>
const UNIT_NAMES=["Feedback와 learner 반응", "의미 협상과 전달 전략", "Drill 판별", "평가 절차와 채점", "문항 수정 원리"];
const Q=[
  {
    "id": "FB01",
    "unit": 1,
    "src": "사례 판별",
    "cat": "Feedback와 learner 반응",
    "text": "<div class=\"scenario\">교사는 yesterday와 동사 형태를 연결하도록 돕고 있다.<br>S: Yesterday I walk home.<br>T: Yesterday I WALK home? (walk를 강조하여 오류를 그대로 반복)<br>S: Oh, I walked home.</div><p class=\"judgment\">T의 발화는 repetition feedback이다.</p>",
    "ans": true,
    "correct": "<strong>결정 단서:</strong> 잘못된 walk를 고치지 않고 그대로 강조했다.",
    "why": "<p>Teacher가 오류 부분을 반복해 learner의 수정을 유도했다. 정답 형태 walked를 먼저 제공하지 않았다.</p><p><strong>혼동 주의:</strong> Recast는 오류를 제거한 형태로 바꾸어 말한다.</p>",
    "source": "Brown, H. D. (2014). Principles of Language Learning and Teaching (6th ed.), p.272. 이 원리에 근거해 새로 만든 연습문항이며 원문 기출이 아닙니다.",
    "study": "./grammar_study.html#s3",
    "exam": {
      "url": "https://etwiki.net/index.html?id=education_2016_B08",
      "label": "2016학년도 전공 B 8번"
    }
  },
  {
    "id": "FB02",
    "unit": 1,
    "src": "사례 판별",
    "cat": "Feedback와 learner 반응",
    "text": "<div class=\"scenario\">S: He go to school by bus.<br>T: No, “go” is incorrect here. Say “He goes to school by bus.”</div><p class=\"judgment\">T의 발화는 recast이다.</p>",
    "ans": false,
    "correct": "<strong>결정 단서:</strong> 오류임을 명시하고 정답도 제공했다.",
    "why": "<p>이 발화는 explicit correction이다. 단순히 올바른 형태로 다시 말한 것뿐 아니라 incorrect라고 지적한다.</p><p><strong>혼동 주의:</strong> Recast와 explicit correction 모두 정답 형태를 줄 수 있으므로, 오류를 명시했는지를 본다.</p>",
    "source": "Brown, H. D. (2014). Principles of Language Learning and Teaching (6th ed.), p.272. 이 원리에 근거해 새로 만든 연습문항이며 원문 기출이 아닙니다.",
    "study": "./grammar_study.html#s3",
    "exam": {
      "url": "https://etwiki.net/index.html?id=education_2016_B08",
      "label": "2016학년도 전공 B 8번"
    }
  },
  {
    "id": "FB03",
    "unit": 1,
    "src": "사례 판별",
    "cat": "Feedback와 learner 반응",
    "text": "<div class=\"scenario\">주말 이야기를 듣던 교사가 문법 설명 없이 학생의 오류만 바로잡아 대화를 이어 간다.<br>S: I buy a new bag yesterday.<br>T: You bought a new bag yesterday. What color is it?</div><p class=\"judgment\">T의 첫 문장은 recast이다.</p>",
    "ans": true,
    "correct": "<strong>결정 단서:</strong> buy를 bought로 바꾸되 메시지를 유지했다.",
    "why": "<p>의미를 유지하면서 오류를 제거한 reformulation이며 오류라는 명시적 설명은 없다.</p><p><strong>혼동 주의:</strong> 오류를 그대로 되풀이하는 repetition feedback이 아니다.</p>",
    "source": "Brown, H. D. (2014). Principles of Language Learning and Teaching (6th ed.), p.272. 이 원리에 근거해 새로 만든 연습문항이며 원문 기출이 아닙니다.",
    "study": "./grammar_study.html#s3",
    "exam": {
      "url": "https://etwiki.net/index.html?id=education_2011_X20",
      "label": "2011학년도 20번"
    }
  },
  {
    "id": "FB04",
    "unit": 1,
    "src": "사례 판별",
    "cat": "Feedback와 learner 반응",
    "text": "<div class=\"scenario\">이 corrective-feedback 분석에서 uptake는 오류에 주의를 돌리려는 feedback에 대한 learner의 즉각적인 반응이다.<br>S: She go there every day.<br>T: She goes there every day.<br>S: Yes—she go there every day.</div><p class=\"judgment\">마지막 S 발화에는 uptake가 있지만 repair는 없다.</p>",

    "source": "한국교육과정평가원. 2023학년도 중등교사 임용시험 영어 전공 B, 11번, p.8, guidelines ②–③. 이 원리에 근거해 새로 만든 연습문항이며 원문 기출이 아닙니다.",
    "study": "./assessment_study.html#s8",

  },
  {
    "id": "IT02",
    "unit": 5,
    "src": "사례 판별",
    "cat": "문항 수정 원리",
    "text": "<div class=\"scenario\">목표는 주어와 동사의 agreement 판별이다. 수정 전에는 선택지마다 시제와 agreement가 모두 달랐다. 수정 후에는 시제를 simple present로 통일하고, 주어에 맞는 동사형인지 여부만 다르게 했다.</div><p class=\"judgment\">이 수정의 핵심은 stem과 선택지를 더 짧게 만든 데 있다.</p>",

    "correct": "<strong>결정 단서:</strong> 길이보다 시제를 고정하고 agreement만 판단하게 한 것이 핵심이다.",
    "why": "<p>두 가지 판단이 섞이던 문항에서 목표인 agreement만 판별하게 만든 수정이다. 하나의 명확한 문제를 제시하라는 원리에 대응한다.</p><p><strong>혼동 주의:</strong> 간결하게 쓰기와 한 가지 문제만 묻기는 서로 다른 수정 원리이다.</p>",
    "source": "한국교육과정평가원. 2023학년도 중등교사 임용시험 영어 전공 B, 11번, p.8, guidelines ②–③. 이 원리에 근거해 새로 만든 연습문항이며 원문 기출이 아닙니다.",

];
const TOTAL=Q.length;
const SAVE_KEY='ox_education_scenario_v1';
let answers=Array(TOTAL).fill(null),cur=0,mode='normal',unit=0,order=Q.map((_,i)=>i),retry=false;
const el=id=>document.getElementById(id);
function scopedIds(){return Q.map((_,i)=>i).filter(i=>!unit||Q[i].unit===unit);}
function getScore(){return order.filter(i=>answers[i]!==null&&answers[i]===Q[i].ans).length;}
function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,answers,cur,mode,unit,order,retry}));}catch(e){}}
function clearProgress(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function start(ids,isRetry=false){
 order=[...ids]; if(!order.length)return;
 if(mode==='random'){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}else order.sort((a,b)=>a-b);
 answers=Array(TOTAL).fill(null);cur=0;retry=isRetry;el('rb').style.display='none';saveProgress();render();
}
function setMode(m){if(!['normal','random'].includes(m)||m===mode)return;mode=m;start(order,retry);}
function setUnit(value){unit=Number(value);if(!Number.isInteger(unit)||unit<0||unit>UNIT_NAMES.length)unit=0;start(scopedIds());}
function freshStart(){mode='normal';unit=0;clearProgress();start(scopedIds());}
function restart(){start(order,retry);}
function retryWrong(){const ids=order.filter(i=>answers[i]!==null&&answers[i]!==Q[i].ans);if(ids.length)start(ids,true);}
function jumpTo(i){if(!Number.isInteger(i)||i<0||i>=order.length)return;cur=i;saveProgress();render();}
function renderExp(q){const a=answers[order[cur]],ok=a===q.ans;
 const cmp=q.compare?`<div class="sec-label">혼동 구분</div><div class="compare">${q.compare.map(c=>`<div class="compare-item"><div class="ci-title">${c.title}</div><p>${c.desc}</p></div>`).join('')}</div>`:'';
 return `<details class="exp show" open><summary class="exp-header"><span>${ok?'✅ 정답':'❌ 오답'} · 정답 ${q.ans?'O':'X'}</span> · 해설 접기/펼치기</summary><div class="exp-answer"><div class="ans-text">${q.correct}</div></div><div class="exp-body"><div>${q.why}</div>${cmp}<div class="sec-label">근거 · 자체 연습문항</div><p>${q.source}</p><p><a href="${q.study}">관련 개념 다시 읽기 →</a></p>${q.exam?`<p><a href="${q.exam.url}">관련 원문 기출: ${q.exam.label} ↗</a></p>`:''}</div></details>`;
}
function renderNav(){el('nav').innerHTML=order.map((idx,pos)=>{const a=answers[idx];return `<button class="nd ${pos===cur?'cur':a===null?'':a===Q[idx].ans?'ok':'ng'}" onclick="jumpTo(${pos})" aria-label="${Q[idx].id}${a===null?', 미응답':a===Q[idx].ans?', 정답':', 오답'}" ${pos===cur?'aria-current="step"':''}>${idx+1}</button>`;}).join('');}
function render(){
 el('unit-filter').value=String(unit);el('btn-normal').classList.toggle('active',mode==='normal');el('btn-random').classList.toggle('active',mode==='random');
 const done=order.filter(i=>answers[i]!==null).length,n=order.length,score=getScore();
 el('pt').textContent=`${retry?'오답 재도전 · ':''}${done} / ${n} 응답`;
 el('ps').textContent=`정답 ${score}개`;el('bf').style.width=(done/n*100).toFixed(1)+'%';
 el('retry-wrong').disabled=!order.some(i=>answers[i]!==null&&answers[i]!==Q[i].ans);
 renderNav();
 if(cur===n){
  el('qa').style.display='none';el('sc').classList.add('show');el('fs').textContent=score;el('score-total').textContent='/'+n;
  el('rm').textContent=score===n?'모두 맞혔습니다!':'해설을 확인하고 다시 도전하세요';
  el('rs').textContent=`${retry?'오답 재도전':unit?UNIT_NAMES[unit-1]:'전체'} ${n}문제 중 ${score}문제 정답 (${Math.round(score/n*100)}%)`;return;
 }
 el('sc').classList.remove('show');el('qa').style.display='block';const idx=order[cur],q=Q[idx],a=answers[idx];
 el('qa').innerHTML=`<div class="card"><div class="q-meta"><span class="q-num">${q.id}</span><span class="q-src">${cur+1} / ${n}</span><span class="q-cat">${q.cat}</span></div><h2 class="unit-label">${q.src} · ${UNIT_NAMES[q.unit-1]}</h2><div class="q-text">${q.text}</div><div class="ox-btns"><button class="ox-btn o-btn ${a===true?(a===q.ans?'co':'wp'):''}" onclick="pick(true)" ${a!==null?'disabled':''}>O<span class="lb">진술이 맞다</span></button><button class="ox-btn x-btn ${a===false?(a===q.ans?'cx':'wp'):''}" onclick="pick(false)" ${a!==null?'disabled':''}>X<span class="lb">진술이 틀리다</span></button></div><div aria-live="polite">${a!==null?renderExp(q):''}</div>${a!==null?`<button class="next-btn show" onclick="next()">${done===n?'결과 보기 →':'다음 미응답 →'}</button>`:''}</div>`;
}
function pick(value){if(typeof value!=='boolean'||cur>=order.length||answers[order[cur]]!==null)return;answers[order[cur]]=value;saveProgress();try{if(value===Q[order[cur]].ans){if(typeof playOk==='function')playOk();}else if(typeof playNg==='function')playNg();}catch(e){}render();}
function next(){
 if(cur>=order.length||answers[order[cur]]===null)return;
 const pending=order.map((_,i)=>(cur+1+i)%order.length).find(pos=>answers[order[pos]]===null);
 if(pending!==undefined){cur=pending;saveProgress();render();return;}
 cur=order.length;saveProgress();render();
 // The shared best-record popup is only comparable for full-bank first attempts.
 if(!unit&&!retry&&order.length===TOTAL&&typeof window.showScorePopup==='function'){
  window.showScorePopup(getScore(),TOTAL,{nextText:'해설·오답 다시 보기',onNextClick:()=>{const overlay=el('sp-overlay');if(overlay)overlay.remove();}});
  const btn=el('sp-retry');if(btn)btn.onclick=()=>{const overlay=el('sp-overlay');if(overlay)overlay.remove();restart();};
 }
}
function validSaved(s){
 return s&&s.v===1&&Number.isInteger(s.unit)&&s.unit>=0&&s.unit<=UNIT_NAMES.length&&['normal','random'].includes(s.mode)&&typeof s.retry==='boolean'&&Array.isArray(s.answers)&&s.answers.length===TOTAL&&s.answers.every(a=>a===null||typeof a==='boolean')&&Array.isArray(s.order)&&s.order.length>0&&s.order.length<=TOTAL&&new Set(s.order).size===s.order.length&&s.order.every(i=>Number.isInteger(i)&&i>=0&&i<TOTAL&&(!s.unit||Q[i].unit===s.unit))&&(s.retry||s.order.length===Q.filter(q=>!s.unit||q.unit===s.unit).length)&&Number.isInteger(s.cur)&&s.cur>=0&&s.cur<=s.order.length&&(s.cur!==s.order.length||s.order.every(i=>s.answers[i]!==null));
}
(function(){
 let loaded=false;try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(validSaved(s)){({answers,cur,mode,unit,order,retry}=s);loaded=true;}}catch(e){}
 const requested=new URLSearchParams(location.search).get('unit');
 if(requested!==null&&/^[1-9]\d*$/.test(requested)&&Number(requested)<=UNIT_NAMES.length&&(!loaded||unit!==Number(requested))){unit=Number(requested);start(scopedIds());return;}
 if(loaded){el('rb-msg').textContent='저장한 학습을 이어서 보여 드립니다.';el('rb').style.display='block';}render();
})();

</script>
